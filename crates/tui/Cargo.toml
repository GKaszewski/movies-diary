[package]
name = "tui"
version = "0.1.0"
edition.workspace = true

[features]
default = []
macos = ["dep:apple-native-keyring-store"]
linux-zbus = [
    "dep:zbus-secret-service-keyring-store",
    "zbus-secret-service-keyring-store/rt-tokio-crypto-rust",
]
windows = ["dep:windows-native-keyring-store"]

[dependencies]
ratatui = { workspace = true }
keyring-core = { workspace = true }
directories = { workspace = true }
csv = { workspace = true }

apple-native-keyring-store = { workspace = true, optional = true }
zbus-secret-service-keyring-store = { workspace = true, optional = true }
windows-native-keyring-store = { workspace = true, optional = true }

api-types = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true, features = ["ring", "std", "tls12", "logging"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }
anyhow = { workspace = true }
uuid = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }

