[package]
name = "worker"
version = "0.1.0"
edition.workspace = true

[features]
default = ["federation"]
federation = ["bootstrap/federation"]
nats = ["bootstrap/nats"]
sqlite = []
sqlite-federation = ["federation"]

[dependencies]
bootstrap = { workspace = true }
config = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync"] }
anyhow = { workspace = true }
dotenvy = { workspace = true }
tracing = { workspace = true }
